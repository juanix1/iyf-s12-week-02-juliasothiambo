<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Practice | Julius Othiambo</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        .form-page {
            padding: 60px 0;
        }

        .form-page > .container > h1 {
            text-align: center;
        }

        .form-page > .container > p {
            text-align: center;
            color: var(--color-muted);
            margin-bottom: 35px;
        }

        .responsive-form {
            max-width: 700px;
            margin: 0 auto;
            background-color: var(--color-white);
            padding: 30px;
            border: 1px solid var(--color-border);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .required {
            color: #dc2626;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            font-family: 'Roboto', sans-serif;
            font-size: var(--font-base);
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .checkbox-group input {
            width: auto;
        }

        .submit-button {
            width: 100%;
            border: none;
        }

        @media (min-width: 768px) {
            .responsive-form {
                padding: 40px;
            }

            .form-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
